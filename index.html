<!DOCTYPE html>
<html lang="en">
  <head> <link rel="manifest" href="/to-do-list/manifest.json">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Space</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="welcome-screen" id="welcome-screen" aria-labelledby="welcome-title">
      <div class="welcome-card">
        <p class="welcome-kicker">Daily Space</p>
        <h1 class="welcome-title" id="welcome-title">Welcome</h1>
        <p class="welcome-copy">A quiet space for workflows</p>
        <a class="btn btn-primary welcome-enter" href="todo.html">Enter To-do list</a>
      </div>
    </section>

    <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false">
      <span class="theme-toggle-icon" aria-hidden="true">D</span>
      <span class="theme-toggle-label">Dark</span>
    </button>
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/to-do-list/sw.js')
      .then(() => console.log('SW registered'))
      .catch((err) => console.log('SW error:', err));
  }
</script>
  </body>
</html>
