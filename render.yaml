services:
  - type: web
    name: daily-space
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DISABLE_STOCK_SCHEDULER
        value: "1"
      - key: GOOGLE_SIGNIN_CLIENT_ID
        sync: false
      - key: GOOGLE_SIGNIN_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_SIGNIN_CLIENT_ID
        sync: false
      - key: MICROSOFT_SIGNIN_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_OAUTH_CLIENT_ID
        sync: false
      - key: MICROSOFT_OAUTH_CLIENT_SECRET
        sync: false
      - key: WECHAT_OAUTH_APP_ID
        sync: false
      - key: WECHAT_OAUTH_APP_SECRET
        sync: false
      - key: MAIL_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MAIL_OAUTH_BASE_URL
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: llama-3.3-70b-versatile
