<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tally Book</title>
    <script src="daily-loop.js"></script>
    <script src="theme.js"></script>
    <script src="i18n.js"></script>
    <script src="bento-rail.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="tally.css" />
  </head>
  <body class="tally-page">
    <button type="button" class="sidebar-trigger" id="sidebar-trigger" aria-controls="sidebar" aria-expanded="false">
      Menu
    </button>
    <div class="backdrop" id="sidebar-backdrop" hidden aria-hidden="true"></div>

    <div class="layout">
      <aside class="sidebar" id="sidebar" aria-label="Navigation">
        <div class="sidebar-inner">
          <div class="sidebar-heading">Pages</div>
          <a href="todo.html#today" class="sidebar-page-link">Todo</a>
          <a href="calendar.html" class="sidebar-page-link">Calendar</a>
          <a href="planner.html" class="sidebar-page-link">Planner</a>
          <a href="mail.html" class="sidebar-page-link">Mail</a>
          <details class="sidebar-more" open>
            <summary class="sidebar-more-summary">More</summary>
            <a href="tally.html" class="sidebar-page-link is-active" aria-current="page">Tally book</a>
            <a href="teamwork.html" class="sidebar-page-link">Teamwork</a>
          </details>
        </div>
      </aside>

      <main class="main-area">
        <div class="tally-app">
          <header class="tally-topbar">
            <div class="tally-period-switcher" aria-label="Month navigation">
              <button type="button" class="tally-nav-btn" id="tally-prev" aria-label="Previous month">‹</button>
              <button type="button" class="tally-period-btn" id="tally-today" title="Return to this month">
                <span id="tally-month-title"></span>
              </button>
              <button type="button" class="tally-nav-btn" id="tally-next" aria-label="Next month">›</button>
            </div>
            <button type="button" class="tally-icon-btn" id="tally-settings-toggle" aria-expanded="false" aria-controls="tally-settings" aria-label="Budget settings">⚙</button>
          </header>

          <section class="tally-settings" id="tally-settings" hidden>
            <label class="tally-budget-row" for="tally-budget">
              <span>Monthly budget</span>
              <input type="number" min="0" step="1" id="tally-budget" class="tally-budget-input" />
            </label>
            <label class="tally-budget-row" for="tally-currency">
              <span>Currency symbol</span>
              <input type="text" id="tally-currency" class="tally-currency-input" list="tally-currency-options" maxlength="8" placeholder="¥" />
            </label>
            <datalist id="tally-currency-options">
              <option value="¥"></option>
              <option value="$"></option>
              <option value="€"></option>
              <option value="£"></option>
              <option value="₩"></option>
              <option value="₹"></option>
              <option value="HK$"></option>
              <option value="S$"></option>
            </datalist>
            <div class="tally-progress"><span id="tally-progress-bar"></span></div>
            <p class="tally-card-note" id="tally-budget-note"></p>
          </section>

          <section class="tally-overview-card" aria-label="Expense summary">
            <div class="tally-today-strip" id="tally-today-strip">
              <p class="tally-overview-label">Spent today</p>
              <strong class="tally-today-total" id="tally-today-total">¥0.00</strong>
            </div>
            <p class="tally-overview-label">Spent this week</p>
            <strong class="tally-week-total" id="tally-week-total">¥0.00</strong>
            <p class="tally-meta" id="tally-meta"></p>
            <div class="tally-bars" id="tally-bars"></div>
          </section>

          <section class="tally-transactions" aria-label="Expense records">
            <div class="tally-records-head">
              <h1>Transactions</h1>
              <span><b id="tally-month-total">¥0.00</b> this month</span>
            </div>
            <ul class="tally-record-list" id="tally-record-list"></ul>
            <p class="tally-empty" id="tally-empty"></p>
          </section>

          <button type="button" class="tally-add-fab" id="tally-add-open" aria-label="Add expense">+</button>

          <div class="tally-sheet" id="tally-add-sheet" hidden>
            <button type="button" class="tally-sheet-backdrop" id="tally-add-backdrop" aria-label="Close add expense"></button>
            <section class="tally-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="tally-add-title">
              <div class="tally-sheet-head">
                <div>
                  <p>New transaction</p>
                  <h2 id="tally-add-title">Add expense</h2>
                </div>
                <button type="button" class="tally-sheet-close" id="tally-add-close" aria-label="Close add expense">×</button>
              </div>
              <form class="tally-form" id="tally-form" autocomplete="off">
                <label>Date<input type="date" id="tally-date" required /></label>
                <label>Amount<input type="number" min="0" step="0.01" id="tally-amount" placeholder="0.00" required /></label>
                <label>Category<input type="text" id="tally-category" placeholder="Coffee, groceries..." maxlength="40" required /></label>
                <label>Note<input type="text" id="tally-note" placeholder="Optional note" maxlength="120" /></label>
                <button type="submit" class="tally-submit-btn">Add transaction</button>
              </form>
            </section>
          </div>
        </div>
      </main>
    </div>

    <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false">
      <span class="theme-toggle-icon" aria-hidden="true">D</span>
      <span class="theme-toggle-label">Dark</span>
    </button>

    <script src="tally.js"></script>
    <script src="agent-data.js"></script>
    <script src="agent-ui.js"></script>
  </body>
</html>
