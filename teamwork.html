<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teamwork</title>
    <script src="theme.js"></script>
    <script src="i18n.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="teamwork.css" />
  </head>
  <body class="teamwork-page">
    <button type="button" class="sidebar-trigger" id="sidebar-trigger" aria-controls="sidebar" aria-expanded="false">
      Menu
    </button>
    <div class="backdrop" id="sidebar-backdrop" hidden aria-hidden="true"></div>

    <div class="layout">
      <aside class="sidebar" id="sidebar" aria-label="Navigation">
        <div class="sidebar-inner">
          <div class="sidebar-heading">Pages</div>
          <a href="todo.html" class="sidebar-page-link">To-do list</a>
          <a href="planner.html" class="sidebar-page-link">Planner</a>
          <a href="calendar.html" class="sidebar-page-link">Calendar</a>
          <a href="tally.html" class="sidebar-page-link">Tally book</a>
          <a href="teamwork.html" class="sidebar-page-link is-active" aria-current="page">Teamwork</a>
          <a href="mail.html" class="sidebar-page-link">Mail</a>
        </div>
      </aside>

      <main class="main-area">
        <div class="teamwork-app">
          <header class="teamwork-hero teamwork-card">
            <div>
              <label class="teamwork-field-label" for="teamwork-kicker">Page label</label>
              <input id="teamwork-kicker" class="teamwork-inline-input teamwork-eyebrow" data-field="kicker" />
              <label class="teamwork-field-label" for="teamwork-title">Title</label>
              <textarea id="teamwork-title" class="teamwork-inline-input teamwork-title" data-field="title" rows="2"></textarea>
              <label class="teamwork-field-label" for="teamwork-copy">Description</label>
              <textarea id="teamwork-copy" class="teamwork-inline-input teamwork-copy" data-field="copy" rows="2"></textarea>
            </div>
            <div class="teamwork-status-card" aria-label="Team status">
              <label class="teamwork-field-label" for="teamwork-status-label">Status label</label>
              <input id="teamwork-status-label" class="teamwork-inline-input teamwork-status-label" data-field="statusLabel" />
              <label class="teamwork-field-label" for="teamwork-status-main">Main status</label>
              <input id="teamwork-status-main" class="teamwork-inline-input teamwork-status-main" data-field="statusMain" />
              <label class="teamwork-field-label" for="teamwork-status-sub">Status note</label>
              <input id="teamwork-status-sub" class="teamwork-inline-input teamwork-status-sub" data-field="statusSub" />
            </div>
          </header>

          <section class="teamwork-grid" aria-label="Teamwork overview">
            <article class="teamwork-card">
              <label class="teamwork-field-label" for="teamwork-focus-kicker">Card label</label>
              <input id="teamwork-focus-kicker" class="teamwork-inline-input teamwork-kicker" data-field="focusKicker" />
              <label class="teamwork-field-label" for="teamwork-focus-title">Card title</label>
              <input id="teamwork-focus-title" class="teamwork-inline-input teamwork-card-title" data-field="focusTitle" />
              <label class="teamwork-field-label" for="teamwork-focus-copy">Card content</label>
              <textarea id="teamwork-focus-copy" class="teamwork-inline-input teamwork-card-copy" data-field="focusCopy" rows="4"></textarea>
            </article>

            <article class="teamwork-card">
              <label class="teamwork-field-label" for="teamwork-notes-kicker">Card label</label>
              <input id="teamwork-notes-kicker" class="teamwork-inline-input teamwork-kicker" data-field="notesKicker" />
              <label class="teamwork-field-label" for="teamwork-notes-title">Card title</label>
              <input id="teamwork-notes-title" class="teamwork-inline-input teamwork-card-title" data-field="notesTitle" />
              <label class="teamwork-field-label" for="teamwork-notes">Notes</label>
              <textarea id="teamwork-notes" class="teamwork-inline-input teamwork-card-copy" data-field="notes" rows="5"></textarea>
            </article>

            <article class="teamwork-card teamwork-members">
              <label class="teamwork-field-label" for="teamwork-members-kicker">Card label</label>
              <input id="teamwork-members-kicker" class="teamwork-inline-input teamwork-kicker" data-field="membersKicker" />
              <label class="teamwork-field-label" for="teamwork-members-title">Card title</label>
              <input id="teamwork-members-title" class="teamwork-inline-input teamwork-card-title" data-field="membersTitle" />
              <div class="teamwork-member-list" id="teamwork-member-list"></div>
              <form class="teamwork-add-form" id="teamwork-member-form" autocomplete="off">
                <input class="teamwork-form-input" id="teamwork-member-name" placeholder="Member name" />
                <input class="teamwork-form-input" id="teamwork-member-role" placeholder="Role" />
                <button class="btn btn-primary" type="submit">Add</button>
              </form>
            </article>
          </section>

          <section class="teamwork-card teamwork-task-board" aria-labelledby="teamwork-tasks-title">
            <div class="teamwork-section-head">
              <div>
                <label class="teamwork-field-label" for="teamwork-tasks-kicker">Section label</label>
                <input id="teamwork-tasks-kicker" class="teamwork-inline-input teamwork-kicker" data-field="tasksKicker" />
                <label class="teamwork-field-label" for="teamwork-tasks-title">Section title</label>
                <input id="teamwork-tasks-title" class="teamwork-inline-input teamwork-card-title" data-field="tasksTitle" />
              </div>
            </div>
            <div class="teamwork-task-grid" id="teamwork-task-grid"></div>
          </section>
        </div>
      </main>
    </div>

    <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false">
      <span class="theme-toggle-icon" aria-hidden="true">D</span>
      <span class="theme-toggle-label">Dark</span>
    </button>
    <script src="teamwork.js"></script>
    <script src="agent-data.js"></script>
    <script src="agent-ui.js"></script>
  </body>
</html>
