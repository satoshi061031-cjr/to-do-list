name: Tests

# Pull requests and pushes to main. Push runs are limited to main so a pull
# request branch is not tested twice; use "Run workflow" for any other branch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request or branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # playwright-core does not download a browser by itself. Install the
      # Chromium build that matches the locked version, with its system packages.
      # The tests launch the full browser, so the headless shell is skipped.
      - name: Install Chromium for playwright-core
        run: npx playwright-core install --with-deps --no-shell chromium

      - name: UI tests
        env:
          CHROMIUM_NO_SANDBOX: "1"
        run: |
          CHROMIUM_PATH="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          export CHROMIUM_PATH
          echo "Using Chromium at $CHROMIUM_PATH"
          npm run test:ui
