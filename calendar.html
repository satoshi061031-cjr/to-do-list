<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Calendar</title>
    <script src="daily-loop.js"></script>
    <script src="theme.js"></script>
    <script src="i18n.js"></script>
    <script src="bento-rail.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="m-dock.css" />
    <link rel="stylesheet" href="calendar.css" />
  </head>
  <body class="calendar-page calendar-week-workspace">
    <button type="button" class="sidebar-trigger" id="sidebar-trigger" aria-controls="sidebar" aria-expanded="false">
      Menu
    </button>
    <div class="backdrop" id="sidebar-backdrop" hidden aria-hidden="true"></div>

    <div class="layout">
      <aside class="sidebar" id="sidebar" aria-label="Navigation">
        <div class="sidebar-inner">
          <div class="sidebar-heading">Pages</div>
          <a href="todo.html#today" class="sidebar-page-link">Todo</a>
          <a href="calendar.html" class="sidebar-page-link is-active" aria-current="page">Calendar</a>
          <a href="planner.html" class="sidebar-page-link">Planner</a>
          <a href="mail.html" class="sidebar-page-link">Mail</a>
          <a href="tally.html" class="sidebar-page-link">Tally book</a>
          <details class="sidebar-more">
            <summary class="sidebar-more-summary">More</summary>
            <a href="teamwork.html" class="sidebar-page-link">Teamwork</a>
          </details>
        </div>
      </aside>

      <main class="main-area">
        <div class="calendar-app calendar-app-solo cal-shell">
          <section class="cal-board" aria-label="Week calendar">
          <section class="cal-board" aria-label="Week calendar">
            <header class="cal-top">
              <form class="cal-search" id="cal-search-form" role="search" autocomplete="off">
                <label class="cal-sr" for="cal-search-input">Search schedule</label>
                <input
                  type="search"
                  id="cal-search-input"
                  class="cal-search-input"
                  placeholder="Search tasks & reminders…"
                  maxlength="120"
                />
                <div class="cal-search-chips" role="group" aria-label="Search filters">
                  <button type="button" class="cal-search-chip is-active" data-cal-filter="all">All</button>
                  <button type="button" class="cal-search-chip" data-cal-filter="tasks">Tasks</button>
                  <button type="button" class="cal-search-chip" data-cal-filter="reminders">Reminders</button>
                </div>
              </form>

              <div class="cal-top-main">
                <div class="cal-top-copy">
                  <h1 class="calendar-title" id="calendar-title">Stay up to date</h1>
                  <p class="calendar-meta" id="calendar-meta"></p>
                  <div class="cal-upcoming" id="cal-upcoming" hidden>
                    <span class="cal-upcoming-kicker">Upcoming</span>
                    <span class="cal-upcoming-text" id="cal-upcoming-text"></span>
                    <span class="cal-upcoming-time" id="cal-upcoming-time"></span>
                  </div>
                </div>

                <div class="cal-toolbar" aria-label="Calendar controls">
                  <div class="cal-range" role="group" aria-label="Week range">
                    <button type="button" class="cal-range-nav" id="calendar-prev" aria-label="Previous week">‹</button>
                    <button type="button" class="cal-range-pill" id="calendar-range" aria-live="polite">
                      <span id="calendar-range-label">This week</span>
                    </button>
                    <button type="button" class="cal-range-nav" id="calendar-next" aria-label="Next week">›</button>
                  </div>

                  <button type="button" class="btn btn-primary cal-add-btn" id="calendar-add-event">
                    + Add reminder
                  </button>

                  <div class="cal-view-toggle" role="tablist" aria-label="Calendar view">
                    <button type="button" class="cal-view-btn" id="calendar-today" role="tab" aria-selected="false" data-cal-view="today">
                      Today
                    </button>
                    <button type="button" class="cal-view-btn is-active" id="calendar-view-week" role="tab" aria-selected="true" data-cal-view="week">
                      Week
                    </button>
                    <button type="button" class="cal-view-btn" id="calendar-view-month" role="tab" aria-selected="false" data-cal-view="month">
                      Month
                    </button>
                  </div>
                </div>
              </div>
            </header>

            <div class="cal-week" id="week-grid">
              <div class="cal-week-head" id="week-head"></div>
              <div class="cal-week-body">
                <div class="cal-hours" id="week-hours" aria-hidden="true"></div>
                <div class="cal-cols" id="week-cols"></div>
              </div>
              <p class="cal-week-empty" id="cal-week-empty" hidden>No timed reminders this week — add one below.</p>
            </div>

            <div class="cal-composer" id="cal-composer">
              <div class="selected-day-head">
                <div class="selected-day-copy">
                  <h2 class="selected-day-title" id="selected-day-title"></h2>
                  <p class="selected-day-meta" id="selected-day-meta"></p>
                </div>
                <a class="calendar-todo-link" id="calendar-open-todo" href="todo.html#today" hidden>Open in Todo</a>
              </div>

              <div class="cal-day-block">
                <p class="cal-day-kicker">Tasks</p>
                <form class="day-task-form" id="day-task-form" autocomplete="off">
                  <label class="day-task-label" for="day-task-input">Add a task for this day</label>
                  <div class="day-task-row">
                    <input
                      type="text"
                      id="day-task-input"
                      class="day-task-input"
                      placeholder="Add a task for this day…"
                      maxlength="500"
                      aria-label="New task for selected day"
                    />
                    <button type="submit" class="btn btn-primary day-task-submit">Add</button>
                  </div>
                </form>
                <ul class="todo-list" id="task-list" aria-live="polite"></ul>
                <p class="calendar-empty" id="task-empty" hidden></p>
              </div>

              <div class="cal-day-block">
                <p class="cal-day-kicker">Reminders</p>
                <form class="reminder-form" id="reminder-form" autocomplete="off">
                  <input
                    type="text"
                    id="reminder-input"
                    class="reminder-input"
                    placeholder="Add a timed reminder…"
                    maxlength="200"
                    aria-label="Add reminder"
                  />
                  <div class="reminder-time-row">
                    <label class="reminder-time-field">
                      <span>Start</span>
                      <input type="time" id="reminder-start-time" class="reminder-time-input" />
                    </label>
                    <label class="reminder-time-field">
                      <span>End</span>
                      <input type="time" id="reminder-end-time" class="reminder-time-input" />
                    </label>
                    <label class="reminder-priority-field">
                      <span>Priority</span>
                      <select id="reminder-priority" class="reminder-priority-select">
                        <option value="high">High</option>
                        <option value="medium" selected>Medium</option>
                        <option value="low">Low</option>
                      </select>
                    </label>
                    <button type="submit" class="btn btn-primary reminder-submit">Add</button>
                  </div>
                </form>
                <button type="button" class="btn calendar-alerts-btn" id="calendar-alerts-btn">Enable reminder alerts</button>
                <ul class="calendar-item-list" id="reminder-list" hidden></ul>
                <p class="calendar-empty" id="reminder-empty" hidden></p>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <!-- Month grid kept off-screen for any legacy hooks; week view is primary -->
    <div class="app-cal-grid" id="calendar-grid" hidden aria-hidden="true"></div>

    <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false">
      <span class="theme-toggle-icon" aria-hidden="true">D</span>
      <span class="theme-toggle-label">Dark</span>
    </button>

    <script src="calendar.js"></script>
    <script src="agent-data.js"></script>
    <script src="agent-ui.js"></script>
  </body>
</html>
